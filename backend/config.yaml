# Digital Twin — simulation constants (TRD Section 4).
# Nothing in physics.py/engine.py is hardcoded; everything traces back here.

seed: 42
n_wells: 12

sim_clock:
  dt_days: 0.25
  tick_ms: 250
  speed_min: 0.5
  speed_max: 8.0
  speed_default: 1.0
  horizon_days: 120.0

physics:
  T_base: 50.0
  T_peak_range: [160.0, 200.0]
  tau_range: [20.0, 40.0]
  visc_A: 1.16e-6
  visc_B: 7434.0
  dP_psi: 200.0
  J_default: 10.0        # decision D1 — rescaled inflow so SPM actually matters
  J_prd_literal: 0.5     # PRD-literal mode toggle
  S_range: [64.0, 144.0]
  N_range: [2.0, 8.0]
  N_min: 2.0
  A_p_in2: 2.41
  E_v: 0.8
  rho_rod: 7850.0
  rho_fluid: 950.0
  g: 9.81
  d_rod_m: 0.022
  R_amber: 0.8
  R_red: 1.0
  T_wax: 65.0
  steam_downtime_days: 7.0
  cycle_days: 120.0
  noise_pct: 0.02

control_loop:
  loop_trigger: red        # "amber" or "red"
  spm_step: 1.5
  loop_cooldown_days: 2.0
  auto_resteam: false
  enabled_default: true

economics:
  oil_price_inr: 6000.0

visual:
  rod_speed_visual_multiplier: 5.0
